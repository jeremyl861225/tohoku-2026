<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南東北環線 互動式景點指南｜2026.09.22–27</title>
<style>
:root{
  --ink:#12232E; --ink2:#415866; --ink3:#7A8D97;
  --paper:#EFF2F1; --card:#FFFFFF;
  --exp:#0B6E4F; --sign:#114E8C; --aoike:#1C7FC4; --ochre:#B87C1E;
  --rule:#D3DAD7; --rule2:#E6EBE9; --warn:#A33A2A;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:"PingFang TC","Hiragino Sans","Noto Sans CJK TC","Noto Sans TC",-apple-system,"Helvetica Neue",sans-serif;
  --serif:"Songti TC","Hiragino Mincho ProN","Noto Serif CJK TC","Noto Serif TC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.75;letter-spacing:.01em}
a{color:var(--sign)}

/* ── 頂欄 ── */
.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  border-bottom:1px solid #0A1720}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 12px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-size:22px;letter-spacing:.06em;font-weight:700}
.brand .sub{font-family:var(--mono);font-size:11px;color:#8FB6CE;letter-spacing:.12em}
.controls{display:flex;gap:10px;align-items:center;margin-top:11px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
  background:transparent;color:#B9CBD6;border:1px solid rgba(255,255,255,.22);
  padding:5px 11px;border-radius:2px;cursor:pointer;transition:.15s}
.chip:hover{border-color:rgba(255,255,255,.5);color:#fff}
.chip[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}
.chip:focus-visible{outline:2px solid #8FB6CE;outline-offset:2px}
.search{margin-left:auto;position:relative}
.search input{font-family:var(--sans);font-size:13px;color:#fff;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);
  border-radius:2px;padding:6px 11px 6px 30px;width:210px;transition:.15s}
.search input::placeholder{color:#7D9DB0}
.search input:focus{outline:none;border-color:#8FB6CE;background:rgba(255,255,255,.15)}
.search svg{position:absolute;left:9px;top:8px;width:14px;height:14px;stroke:#7D9DB0;
  fill:none;stroke-width:2}
.count{font-family:var(--mono);font-size:11px;color:#8FB6CE;white-space:nowrap}

/* ── 版面 ── */
.wrap{max-width:1240px;margin:0 auto;padding:20px;display:flex;gap:22px;align-items:flex-start}
.mapside{flex:0 0 396px;position:sticky;top:104px}
.mapcard{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:14px}
.mapcard h2{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink3);
  text-transform:uppercase;margin-bottom:10px}
.maphint{font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.6;
  border-top:1px solid var(--rule2);padding-top:9px}
.list{flex:1 1 auto;min-width:0}

/* ── 地圖 ── */
svg.map{width:100%;height:auto;display:block;border:1px solid var(--rule2);border-radius:2px}
.leg{margin:0 0 14px 0;border-left:3px solid var(--aoike);background:#E8EFF3;
  border-radius:0 3px 3px 0}
/* 手機寬度放不下時，讓「起點 → 終點」整條掉到第二行，而不是把時間距離折成兩截 */
.leg a{display:flex;flex-wrap:wrap;align-items:center;gap:3px 9px;padding:8px 14px;
  font-family:var(--mono);font-size:12px;color:var(--ink2);text-decoration:none}
.l-txt{white-space:nowrap}
.leg a:hover{background:#DBE6ED}
.leg.same{border-left-color:#B6C4BF;background:#EFF2F1}
/* 住宿 → 當天第一站。虛線左框表示「這段跨夜」，與日間的實線段區隔 */
.leg.leg-day{border-left-style:dashed;background:#EDF1F4}
.l-stay{color:var(--ink3);font-size:10px;border:1px solid #C3D0D6;border-radius:2px;
  padding:0 3px;margin-right:5px;background:#fff}
.l-ico{color:var(--aoike);font-weight:700;font-size:13px}
.leg.same .l-ico{color:#9AAAA5}
.l-approx{color:var(--ink3);font-size:10px;border:1px solid #C3D0D6;border-radius:2px;padding:0 3px;margin-right:5px}
.l-go{margin-left:auto;color:var(--aoike);font-size:11px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seq{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;
  border-radius:50%;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;
  font-weight:700;flex:0 0 21px;margin-right:8px}
.spot.opt .seq{background:#93A6AE}
.tbd{background:#F3EEE2;border-left:3px solid var(--ochre)}
.m-seq{fill:#fff;font-size:9px;font-weight:700;text-anchor:middle;font-family:var(--mono)}
.m-dot-seq{fill:var(--ink);stroke:#fff;stroke-width:1.8}
.m-dot-seq.wide{r:12}
.m-seq{paint-order:stroke}
.m-day{display:none}
.m-day.on{display:inline}
.m-all.off{display:none}
.m-sea{fill:#DEE7EB}
.m-land{fill:#F8FAF9;stroke:#B6C4BF;stroke-width:.7;stroke-linejoin:round}
.m-lake{fill:#CFDEE6;stroke:#A9BFC9;stroke-width:.6}
.m-route-case{fill:none;stroke:#fff;stroke-width:6;stroke-linejoin:round;stroke-linecap:round;opacity:.95}
.m-route{fill:none;stroke:var(--aoike);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.m-back{fill:none;stroke:#7FA6BE;stroke-width:2.2;stroke-dasharray:5 4;stroke-linecap:round}
.m-dot{fill:var(--aoike);stroke:#fff;stroke-width:1.6}
.m-dot-stay{fill:var(--ink);stroke:#fff;stroke-width:2}
.m-dot-term{fill:var(--ochre);stroke:#fff;stroke-width:2}
.m-dot-term-in{fill:#fff}
.m-badge{fill:#fff;font-size:9px;font-weight:700;text-anchor:middle;font-family:var(--mono)}
.m-lbl{fill:var(--ink2);font-size:10.5px;font-family:var(--sans)}
.m-lbl.strong{fill:var(--ink);font-weight:700}
.m-pref{fill:#B2C1C4;font-size:11px;letter-spacing:.3em;text-anchor:middle;font-family:var(--sans)}
.m-scale line{stroke:var(--ink3);stroke-width:1}
.m-scale text{fill:var(--ink3);font-size:8.5px;text-anchor:middle;font-family:var(--mono)}
.m-north path{fill:var(--ink3)}
.m-north text{fill:var(--ink3);font-size:9px;text-anchor:middle;font-family:var(--mono)}
.m-hit{fill:transparent;cursor:pointer}
.m-pin{cursor:pointer}
.m-pin:focus{outline:none}
.m-pin:focus-visible .m-hit{stroke:var(--ochre);stroke-width:2;fill:rgba(184,124,30,.12)}
.m-pin:hover .m-lbl,.m-pin.on .m-lbl{fill:var(--ochre);font-weight:700}
.m-pin:hover .m-dot,.m-pin.on .m-dot{fill:var(--ochre);r:6}
.m-pin.on .m-dot-stay{fill:var(--ochre)}
.m-pin.dim{opacity:.28}

/* ── 日期分隔 ── */
.dayhead{display:flex;align-items:center;gap:14px;margin:26px 0 12px;flex-wrap:wrap}
.dayhead:first-child{margin-top:0}
.dayhead .n{font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  background:var(--ink);color:#fff;padding:4px 10px;border-radius:2px}
.dayhead .r{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.04em}
.dayhead .d{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.dayhead .line{flex:1 1 auto;height:1px;background:var(--rule);min-width:20px}

/* ── 卡片 ── */
.spot{background:var(--card);border:1px solid var(--rule);border-radius:3px;
  margin-bottom:12px;overflow:hidden;scroll-margin-top:120px;transition:box-shadow .2s,border-color .2s}
.spot.hl{border-color:var(--ochre);box-shadow:0 0 0 3px rgba(184,124,30,.15)}
.spot-top{display:flex;gap:0;align-items:stretch}
.figure{flex:0 0 232px;position:relative;background:#E3E9E7;min-height:172px;overflow:hidden}
.figure img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .45s}
.figure img.in{opacity:1}
.figure .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#E7EDEA,#D9E3E4)}
.figure .ph svg{width:64px;height:64px;stroke:#A8BAC0;fill:none;stroke-width:1.3}
.figure figcaption{position:absolute;left:0;right:0;bottom:0;
  font-size:9.5px;color:#fff;background:linear-gradient(transparent,rgba(18,35,46,.82));
  padding:16px 8px 5px;letter-spacing:.02em;line-height:1.4}
.figure figcaption a{color:#CFE2EF;text-decoration:none}
.figure figcaption a:hover{text-decoration:underline}
.head{flex:1 1 auto;padding:15px 18px;min-width:0}
.head .ln1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.head h3{font-size:17px;font-weight:700;letter-spacing:.03em}
.head .jp{font-size:12px;color:var(--ink3)}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.tg{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 7px;
  border:1px solid var(--rule);border-radius:2px;color:var(--ink2);background:#F6F8F7}
.tg.t{color:var(--sign);border-color:#CFDDEE;background:#EEF3F9}
.tg.s{color:var(--exp);border-color:#CFE3D8;background:#F0F5F2}
.desc{font-size:13px;color:var(--ink2);line-height:1.72;margin-top:9px}
.body.hide{display:none}
dl.f{display:grid;grid-template-columns:max-content 1fr;gap:0 14px;margin-top:12px}
dl.f dt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em;
  padding:6px 0;white-space:nowrap}
dl.f dd{font-size:12.5px;color:var(--ink2);padding:6px 0;line-height:1.6}
dl.f dt+dd{border-bottom:1px solid var(--rule2)}
dl.f dt{border-bottom:1px solid var(--rule2)}
dl.f dt:last-of-type,dl.f dd:last-of-type{border-bottom:none}
.note{margin-top:11px;font-size:12.5px;line-height:1.65;padding:8px 11px;
  border-left:3px solid var(--aoike);background:#F4F9FD;border-radius:0 2px 2px 0;color:var(--ink2)}
.note.cam{border-left-color:var(--ochre);background:#FBF7EE}
.note b{color:var(--ink)}
.note .tag{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink3);margin-right:7px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts.bar{padding:11px 18px;border-top:1px solid var(--rule2);background:#FCFDFD}
.body{padding:14px 18px 4px;border-top:1px solid var(--rule2)}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-decoration:none;
  color:var(--ink2);background:#F6F8F7;border:1px solid var(--rule);border-radius:2px;
  padding:5px 11px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink3);color:var(--ink);background:#fff}
.btn:focus-visible{outline:2px solid var(--aoike);outline-offset:2px}
.btn.more{margin-right:auto}
.coord{font-family:var(--mono);font-size:10.5px;color:var(--ink3);align-self:center}

.empty{background:var(--card);border:1px dashed var(--rule);border-radius:3px;
  padding:34px;text-align:center;color:var(--ink3);font-size:13px}
.foot{max-width:1240px;margin:0 auto;padding:8px 20px 44px;
  font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em;line-height:1.8}

@media (max-width:980px){
  .wrap{flex-direction:column;padding:14px}
  .mapside{position:static;flex:1 1 auto;width:100%;align-self:stretch}
  .mapcard{max-width:430px;margin:0 auto}
  .list{width:100%}
}
@media (max-width:640px){
  .top-in{padding:12px 14px 10px}
  .brand h1{font-size:19px}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .spot-top{flex-direction:column}
  .figure{flex:1 1 auto;width:100%;height:186px;min-height:0}
  .head{padding:13px 15px}
  .body{padding:12px 15px 2px}
  .acts.bar{padding:10px 15px}
  dl.f{grid-template-columns:1fr;gap:0}
  dl.f dt{padding:7px 0 0;border-bottom:none}
  dl.f dt+dd{padding-top:1px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .top{position:static}.mapside{position:static}
  .body.hide{display:block}
  .spot{break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>南東北環線・景點指南</h1>
      <span class="sub">2026.09.22–27　仙台進出　全程自駕</span>
      <span class="sub" style="color:#6F93A8">JX862 抵 16:00　／　JX863 起飛 17:20</span>
    </div>
    <div class="controls">
      <div class="chips" id="chips" role="group" aria-label="依日期篩選"></div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋景點、關鍵字…" aria-label="搜尋景點">
      </div>
      <span class="count" id="count"></span>
      <button class="chip" id="reload" hidden title="重新向 Wikipedia 取得照片">重新載入照片</button>
    </div>
  </div>
</header>

<div class="wrap">
  <aside class="mapside">
    <div class="mapcard">
      <h2>Route Map　點擊標記可跳至該景點</h2>
      <!--MAP-->
      <p class="maphint">縣界與海岸線為實際行政區資料。地圖標記對應行程主要節點，點一下會捲動到該景點並標示出來。</p>
    </div>
  </aside>
  <main class="list" id="list"></main>
</div>

<p class="foot">
  照片由瀏覽器即時向 Wikipedia／Wikimedia Commons 取得，版權屬原作者，授權條款見各圖連結。<br>
  營業時間、票價、交通管制與一人泊條件請於出發前向官方再次確認。
</p>

<script>
//--DATA--

/* ── 分類圖示（取不到照片時的後備） ── */
const ICON={
 "湖泊":'<path d="M8 40c8-6 14 4 22-2s16 2 22-4"/><path d="M8 50c8-6 14 4 22-2s16 2 22-4"/><circle cx="46" cy="18" r="7"/>',
 "湖泊・森林":'<path d="M6 46c8-6 16 4 24-2s18 2 26-4"/><path d="M20 40l8-16 8 16z"/><path d="M38 40l7-13 7 13z"/>',
 "溪流・森林":'<path d="M14 8v14M14 22l-6 6M14 22l6 6"/><path d="M6 44c8-5 14 3 22-2s16 3 24-3"/><path d="M6 54c8-5 14 3 22-2s16 3 24-3"/>',
 "海岸":'<path d="M4 40h56"/><path d="M4 50c8-5 14 3 22-2s16 3 26-3"/><path d="M18 40l10-16 10 16z"/>',
 "展望":'<path d="M32 10v44"/><path d="M32 14l18 7-18 7z"/><path d="M20 54h24"/>',
 "高山":'<path d="M6 48l16-28 10 17 6-9 20 20z"/><path d="M18 34h10"/>',
 "溫泉":'<path d="M12 44h40v6a10 10 0 01-10 10H22a10 10 0 01-10-10z"/><path d="M24 34c0-6-6-6-6-12s6-6 6-12"/><path d="M36 34c0-6-6-6-6-12s6-6 6-12"/>',
 "溫泉・住宿":'<path d="M12 44h40v6a10 10 0 01-10 10H22a10 10 0 01-10-10z"/><path d="M24 34c0-6-6-6-6-12s6-6 6-12"/><path d="M36 34c0-6-6-6-6-12s6-6 6-12"/>',
 "溫泉・海岸":'<path d="M8 46c8-5 14 3 22-2s18 3 26-3"/><path d="M22 34c0-6-6-6-6-12s6-6 6-12"/><path d="M36 34c0-6-6-6-6-12s6-6 6-12"/>',
 "古蹟":'<path d="M10 26L32 12l22 14"/><path d="M14 26v26M50 26v26M10 52h44"/><path d="M26 52V38h12v14"/>',
 "世界遺產":'<path d="M10 26L32 12l22 14"/><path d="M14 26v26M50 26v26M10 52h44"/><path d="M26 52V38h12v14"/>',
 "庭園":'<path d="M6 46c10-8 20 2 30-4s16 0 22-4"/><circle cx="20" cy="24" r="8"/><path d="M20 32v14"/><path d="M44 20v26"/>',
 "町並":'<path d="M8 52V28l10-8 10 8v24"/><path d="M32 52V34l10-7 10 7v18"/><path d="M8 52h48"/>',
 "城跡":'<path d="M10 52V22h6v-6h6v6h8v-6h6v6h6v-6h6v6h6v30z"/><path d="M6 52h52"/>',
 "城跡・庭園":'<path d="M10 52V22h6v-6h6v6h8v-6h6v6h6v-6h6v6h6v30z"/><path d="M6 52h52"/>',
 "交通":'<path d="M12 40h40v10H12z"/><circle cx="20" cy="52" r="4"/><circle cx="44" cy="52" r="4"/><path d="M16 40l6-14h20l6 14"/>'
};
const fallbackIcon=t=>ICON[t]||ICON["展望"];

const listEl=document.getElementById('list');
const chipsEl=document.getElementById('chips');
const countEl=document.getElementById('count');
const qEl=document.getElementById('q');
let filterDay='all', query='';

/* ── 建立日期篩選 chips ── */
const days=[...new Set(SPOTS.map(s=>s.day))].sort((a,b)=>a-b);
const mkChip=(v,label,title)=>{
  const b=document.createElement('button');
  b.className='chip'; b.dataset.day=v; b.textContent=label;
  b.setAttribute('aria-pressed', v===filterDay); if(title) b.title=title;
  b.addEventListener('click',()=>{filterDay=v;render();});
  return b;
};
chipsEl.appendChild(mkChip('all','全部'));
days.forEach(d=>chipsEl.appendChild(mkChip(String(d),DAYS[d].label,DAYS[d].date+'　'+DAYS[d].route)));

qEl.addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render();});

/* ── 渲染 ── */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function cardHTML(s,seq){
  // 只用「地名」查詢，點下去會開出該景點的正式頁面（評論、營業時間、照片）。
  // gq 是逐一挑過並實測過的字串；沒有 gq 的才退回座標——Google Maps 查不到地名時
  // 會退回「使用者所在地的同類搜尋」，實測過會指到台北或 463 km 外。
  // gurl = 使用者直接指定的 Google 地點（帶 cid，落點百分之百正確），優先用它
  const gmap=s.gurl ? s.gurl
    : s.gq ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.gq)}`
    : `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
  const rows=(s.fields||[]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('');
  const tip=s.tip?`<p class="note"><span class="tag">NOTE</span>${s.tip}</p>`:'';
  const pho=s.photo?`<p class="note cam"><span class="tag">PHOTO</span>${s.photo}</p>`:'';
  const cls='spot'+(s.opt?' opt':'')+(s.tbd?' tbd':'');
  const kind=/^dinner-/.test(s.id)?'dinner':'spot';
  // 晚餐卡不參與「卡-車程-卡」的鏈：它與前一站同區，走過去就到，沒有車程可言
  const attrs=`data-kind="${kind}" data-seq="${seq}"`
    +(kind==='dinner'?' data-noleg="1"':'')+(s.tbd?' data-tbd="1"':'')+(s.nomap?' data-nopin="1"':'');
  return `
  <article class="${cls}" id="sp-${s.id}" data-id="${s.id}" data-day="${s.day}" ${attrs}>
    <div class="spot-top">
      <div class="head">
        <div class="ln1"><span class="seq">${seq}</span><h3>${esc(s.name)}</h3><span class="jp">${esc(s.jp)}　${esc(s.romaji)}</span></div>
        <div class="meta">
          <span class="tg t">${esc(s.type)}</span>
          <span class="tg s">停留 ${esc(s.stay)}</span>
          <span class="tg">${DAYS[s.day].label} · ${esc(s.time)}</span>
          ${s.opt?'<span class="tg">選配</span>':''}
        </div>
        <p class="desc">${s.desc}</p>
      </div>
    </div>
    <div class="body hide" id="bd-${s.id}">
      <figure class="figure" data-wiki='${esc(JSON.stringify(s.wiki||[]))}'>
        <div class="ph"><svg viewBox="0 0 64 64" stroke-linecap="round" stroke-linejoin="round">${fallbackIcon(s.type)}</svg></div>
      </figure>
      <dl class="f">${rows}</dl>
      ${tip}${pho}
    </div>
    <div class="acts bar">
      <button class="btn more" aria-expanded="false" aria-controls="bd-${s.id}">展開詳情</button>
      <span class="coord">${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</span>
      <a class="btn" href="${gmap}" target="_blank" rel="noopener">Google 地圖</a>
    </div>
  </article>`;
}

// 兩張行程卡之間的車程。起點與終點一律用「地名」帶進 Google 路線，不用座標。
// 距離與時間是靜態資料（寫在 guide_data.js），不在瀏覽器端呼叫任何 API——離線要能用。
// a 為 null 時代表這是「住宿 → 當天第一站」，起點取 leg.from（住宿地地名）。
// 每天第一張卡的前面沒有卡可以當起點，但那段路還是要開——不畫就等於漏掉一段車程。
function legHTML(a,b){
  const L=b.leg; if(!L||L.src==='same') return '';
  const mode=L.src==='walk'?'walking':'driving';
  const o=a?(a.gq||a.jp||a.name):L.from; if(!o) return '';
  const d=b.gq||b.jp||b.name;
  const url=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}`
          +`&destination=${encodeURIComponent(d)}&travelmode=${mode}`;
  const ap=L.src==='osrm'?'<span class="l-approx">約</span>':'';
  const stay=a?'':`<span class="l-stay">${esc(L.stay||'住宿')}</span>`;
  return `<div class="leg${a?'':' leg-day'}" data-day="${b.day}" `
    +`data-from="${a?a.id:'lodging'}" data-to="${b.id}">
    <a href="${url}" target="_blank" rel="noopener" aria-label="${esc(o)} 到 ${esc(d)} 的路線">
      <span class="l-ico">↓</span>
      <span class="l-txt">${stay}${ap}<span class="leg-time">${esc(L.t)}</span>・<span class="leg-dist">${esc(L.d)}</span></span>
      <span class="l-go">${esc(o)} → ${esc(d)} ↗</span></a></div>`;
}

function render(){
  [...chipsEl.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.day===filterDay));
  const shown=SPOTS.slice().sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time)).filter(s=>{
    if(filterDay!=='all' && String(s.day)!==filterDay) return false;
    if(!query) return true;
    const hay=(s.name+s.jp+s.romaji+s.type+s.desc+(s.keys||'')+(s.tip||'')+(s.photo||'')).toLowerCase();
    return hay.includes(query);
  });
  // 晚餐卡不是景點——混進總數會讓「31 個景點」變成 36，數字對不上 ITINERARY
  const isDin=x=>/^dinner-/.test(x.id);
  const nSp=shown.filter(x=>!isDin(x)).length, nDn=shown.length-nSp;
  const totSp=SPOTS.filter(x=>!isDin(x)).length;
  countEl.textContent=`${nSp} / ${totSp} 個景點`+(nDn?`・${nDn} 餐`:'');
  if(!shown.length){
    listEl.innerHTML=`<div class="empty">沒有符合的景點。試試清空搜尋或改選其他日期。</div>`;
  }else{
    let html='',cur=null,seq=0,prev=null;
    // 搜尋狀態下不畫路段——過濾後的相鄰兩張卡未必真的相鄰
    const withLegs=!query;
    shown.forEach(s=>{
      if(s.day!==cur){cur=s.day;seq=0;prev=null;
        html+=`<div class="dayhead"><span class="n">${DAYS[cur].label}</span>
          <span class="r">${DAYS[cur].route}</span>
          <span class="d">${DAYS[cur].date}</span><span class="line"></span></div>`;}
      seq++;
      // prev 為 null（每天第一張）時 legHTML 會改用 leg.from＝住宿地；沒有 from 就自然不畫
      if(withLegs) html+=legHTML(prev,s);
      html+=cardHTML(s,seq);
      prev=s;
    });
    listEl.innerHTML=html;
  }
  // DEFER_PHOTOS 由 PWA 版設定：**第一次**要等 Service Worker 接管後再抓照片，
  // 否則會繞過離線快取。但之後每次重新渲染（切換日期、搜尋）都會重建空的圖框，
  // 必須再抓一次——否則一按 D3 照片就全部消失。PHOTOS_READY 由那段 boot 設起。
  wire(); if(!window.DEFER_PHOTOS||window.PHOTOS_READY) loadPhotos();
  const ids=new Set(shown.map(s=>s.id));
  document.querySelectorAll('.m-pin').forEach(p=>p.classList.toggle('dim',!ids.has(p.dataset.id)));
  syncMap();
}

/* 選單一天時：地圖放大到當天的範圍，只顯示當天的路線與編號標記 */
function syncMap(){
  const svg=document.querySelector('svg.map');
  if(!svg) return;
  let boxes={};
  try{ boxes=JSON.parse(svg.dataset.daybox||'{}'); }catch(e){}
  const all=svg.querySelector('.m-all');
  svg.querySelectorAll('.m-day').forEach(g=>g.classList.toggle('on',g.dataset.day===filterDay));
  const fullW=parseFloat((svg.dataset.full||'0 0 396 402').split(' ')[2])||396;
  if(filterDay==='all'||!boxes[filterDay]){
    if(svg.dataset.full) svg.setAttribute('viewBox',svg.dataset.full);
    if(all) all.classList.remove('off');
  }else{
    const b=boxes[filterDay];
    svg.setAttribute('viewBox',b.join(' '));
    if(all) all.classList.add('off');
    // viewBox 變小 = 畫面放大 k 倍；標記要反向縮 1/k，否則字與圓點會跟著放大成一團
    const k=fullW/b[2];
    svg.querySelectorAll(`.m-day[data-day="${filterDay}"] .m-mk`).forEach(g=>{
      g.setAttribute('transform',`translate(${g.dataset.x},${g.dataset.y}) scale(${(1/k).toFixed(4)})`);
    });
    layoutLabels(filterDay);
  }
}

/* 標籤避讓：用實際量到的螢幕矩形去試位置。建置期估不準渲染尺寸，只能在這裡做。
   八個候選位置都放不下時就隱藏標籤——編號還在，名稱在下面的行程卡看得到。 */
function layoutLabels(day){
  const svg=document.querySelector('svg.map'); if(!svg) return;
  let mks=[...svg.querySelectorAll(`.m-day[data-day="${day}"] .m-mk`)];
  const hit=(a,b)=>a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom;

  // 先還原上一次的併點結果
  mks.forEach(g=>{
    g.style.display='';
    g.removeAttribute('data-covers'); g.removeAttribute('data-merged');
    const t=g.querySelector('.m-seq');
    if(t){ if(!t.dataset.orig) t.dataset.orig=t.textContent; t.textContent=t.dataset.orig; }
    g.querySelector('.m-dot-seq').classList.remove('wide');
    const l=g.querySelector('.m-lbl');
    if(l){ if(!l.dataset.orig) l.dataset.orig=l.textContent; l.textContent=l.dataset.orig; }
  });

  // 靠太近的點併成一個，標示編號範圍——例如 D2 的松島四站在同一公里內，
  // 而當天跨距 100 km，不併的話圓點會整團疊住、編號根本看不到
  const groups=[];
  mks.forEach(g=>{
    const c=g.querySelector('.m-dot-seq').getBoundingClientRect();
    const cx=c.x+c.width/2, cy=c.y+c.height/2;
    const near=groups.find(gr=>Math.hypot(gr.cx-cx,gr.cy-cy)<22);
    if(near) near.items.push(g); else groups.push({cx,cy,items:[g]});
  });
  groups.forEach(gr=>{
    if(gr.items.length<2) return;
    const nums=gr.items.map(g=>+g.querySelector('.m-seq').dataset.orig).sort((a,b)=>a-b);
    // 連號才用範圍；不連號要列舉，否則「1–3」會讓人以為含 2，但 2 可能在別群
    const contig=nums.every((n,i)=>i===0||n===nums[i-1]+1);
    const head=gr.items[0];
    head.querySelector('.m-seq').textContent=
      contig ? nums[0]+'–'+nums[nums.length-1] : nums.join(',');
    head.querySelector('.m-dot-seq').classList.add('wide');
    const hl=head.querySelector('.m-lbl');
    if(hl) hl.textContent=hl.dataset.orig+`（${gr.items.length} 站）`;
    // 併點要留下痕跡：head 記下它代表哪幾個 id，被吸收的記下自己併進了誰
    head.dataset.covers=gr.items.map(g=>g.dataset.id).join(' ');
    gr.items.slice(1).forEach(g=>{g.style.display='none';g.dataset.merged=head.dataset.id;});
  });
  mks=mks.filter(g=>g.style.display!=='none');
  const cands=[[11,4,'start'],[-11,4,'end'],[11,-12,'start'],[-11,-12,'end'],
               [11,20,'start'],[-11,20,'end'],[0,-17,'middle'],[0,27,'middle']];
  const placed=mks.map(g=>g.querySelector('.m-dot-seq').getBoundingClientRect());
  mks.forEach(g=>{
    const t=g.querySelector('.m-lbl'); if(!t) return;
    t.style.display='';
    let ok=false;
    for(const [dx,dy,anc] of cands){
      t.setAttribute('x',dx); t.setAttribute('y',dy); t.setAttribute('text-anchor',anc);
      const b=t.getBoundingClientRect();
      if(!placed.some(p=>hit(b,p))){ placed.push(b); ok=true; break; }
    }
    if(!ok) t.style.display='none';
  });
}

/* ── 互動 ── */
function wire(){
  listEl.querySelectorAll('.btn.more').forEach(b=>{
    b.addEventListener('click',()=>{
      const card=b.closest('.spot');
      const open=card.querySelector('.body').classList.toggle('hide')===false;
      b.setAttribute('aria-expanded',open);
      b.textContent=open?'收合詳情':'展開詳情';
    });
  });
  listEl.querySelectorAll('.spot').forEach(c=>{
    c.addEventListener('mouseenter',()=>markPin(c.dataset.id,true));
    c.addEventListener('mouseleave',()=>markPin(c.dataset.id,false));
  });
}
function markPin(id,on){
  const p=document.querySelector(`.m-pin[data-id="${id}"]`);
  if(p) p.classList.toggle('on',on);
}
function goTo(id){
  const card=document.getElementById('sp-'+id);
  if(!card){ // 該景點被篩掉時先解除篩選
    filterDay='all'; query=''; qEl.value=''; render();
    requestAnimationFrame(()=>goTo(id)); return;
  }
  card.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.spot.hl').forEach(x=>x.classList.remove('hl'));
  card.classList.add('hl');
  setTimeout(()=>card.classList.remove('hl'),2600);
}
document.querySelectorAll('.m-pin').forEach(p=>{
  p.addEventListener('click',()=>goTo(p.dataset.id));
  p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goTo(p.dataset.id);}});
});

/* ── 照片：向 Wikipedia 取代表圖（雙端點，適用 file:// 的 null origin） ── */
const photoCache={};
async function viaRest(title){
  const u=`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
  const r=await fetch(u); if(!r.ok) throw 0;
  const j=await r.json();
  const t=j.thumbnail&&j.thumbnail.source; if(!t) throw 0;
  // 不可自行改寫寬度：Wikimedia 只供應 API 實際產生的那個尺寸，
  // 換成 /900px- 會拿到 400（縮圖服務不再即時產生任意寬度）
  return {src:t,
          page:(j.content_urls&&j.content_urls.desktop.page)||u, title:j.title};
}
async function viaAction(title){
  const u=`https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*`
        +`&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=900`
        +`&redirects=1&titles=${encodeURIComponent(title)}`;
  const r=await fetch(u); if(!r.ok) throw 0;
  const j=await r.json();
  const pages=j.query&&j.query.pages||{};
  for(const k in pages){
    const pg=pages[k];
    if(pg.thumbnail&&pg.thumbnail.source)
      return {src:pg.thumbnail.source,page:pg.fullurl||('https://ja.wikipedia.org/wiki/'+encodeURIComponent(title)),title:pg.title};
  }
  throw 0;
}
async function fetchWiki(title){
  if(title in photoCache) return photoCache[title];
  let out=null;
  // Action API 先試：它能用 pithumbsize 指定尺寸，拿到真正的高解析度縮圖。
  // REST 當後備（只給固定小圖，但在 file:// 的 null origin 下比較可靠）
  try{ out=await viaAction(title); }
  catch(e){ try{ out=await viaRest(title); }catch(e2){ out=null; } }
  photoCache[title]=out; return out;
}
function attach(fig,p){
  const img=new Image();
  // crossOrigin 必須在 src 之前設定。Wikimedia 圖床回 Access-Control-Allow-Origin: *，
  // 走 CORS 才會拿到「可以寫進 Cache」的回應；不設就是 opaque，Service Worker
  // 的 cache.put() 存不進去（離線照片會整批失效，而且首次請求會卡住不回應）
  img.crossOrigin='anonymous';
  // 不可加 loading='lazy'：這個 img 還沒進 DOM，lazy 會讓瀏覽器永遠不開始載入，
  // 而插入 DOM 又要等 onload——互相卡死，22 張照片會全部不出現。
  // 何況離線快取本來就要在第一次連網時把圖全抓下來，本來就不該延後。
  img.alt=p.title; img.decoding='async'; img.referrerPolicy='no-referrer';
  img.onload=()=>{
    fig.querySelector('.ph')&&fig.querySelector('.ph').remove();
    fig.prepend(img);
    requestAnimationFrame(()=>img.classList.add('in'));
    const cap=document.createElement('figcaption');
    cap.innerHTML=`照片：<a href="${p.page}" target="_blank" rel="noopener">Wikipedia／${esc(p.title)}</a>`;
    fig.appendChild(cap);
  };
  img.src=p.src;
}
async function loadPhotos(){
  let ok=0;
  const figs=[...document.querySelectorAll('.figure')];
  await Promise.all(figs.map(async fig=>{
    let cands=[]; try{ cands=JSON.parse(fig.dataset.wiki); }catch(e){}
    for(const t of cands){
      const p=await fetchWiki(t);
      if(p){ attach(fig,p); ok++; return; }
    }
  }));
  const rb=document.getElementById('reload');
  if(rb) rb.hidden = ok>0 || figs.length===0;
}
document.addEventListener('click',e=>{
  if(e.target.id==='reload'){ for(const k in photoCache) delete photoCache[k]; loadPhotos(); }
});

render();
</script>
